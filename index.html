<!doctype html>
<!-- index.html · Mi Guaria, prototipo de práctica del curso de UX y CRO de FC Studio. Pantallas P01 a P20 en js/pantallas/. -->
<html lang="es-CR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Mi Guaria (práctica)</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <!--
    Microsoft Clarity · lugar preparado, sin ID.
    1. En Clarity, abra Settings › Masking y elija Strict ANTES de pegar el código.
    2. Pegue aquí, sin cambiarlo, el código de seguimiento que Clarity da en Settings › Setup.
    3. Compruebe la instalación viendo en la pestaña Network las solicitudes a clarity.ms/collect.
    Nunca llame a clarity("identify", ...) con correos, nombres ni códigos de vendedora.
  -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="escena">
    <div id="telefono" class="telefono">
      <div class="barra-estado" aria-hidden="true">
        <span class="hora-estado">9:41</span>
        <span class="marca-estado">Datos de práctica</span>
        <span class="iconos-estado"><i class="senal"></i><i class="bateria"></i></span>
      </div>
      <div id="barra-direccion" class="barra-direccion" hidden></div>
      <main id="pantalla" class="pantalla" tabindex="-1"></main>
      <div id="notificacion" class="notificacion" role="status" hidden></div>
      <div id="avisos" class="avisos" aria-live="polite"></div>
      <div id="capa" class="capa"></div>
      <button id="codigo-pantalla" class="codigo-pantalla" title="Código de la pantalla. Tóquelo para abrir el panel de quien presenta.">P01</button>
      <nav class="barra-navegacion" aria-label="Botones del teléfono simulado">
        <button data-nav="atras" aria-label="Atrás"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <button data-nav="inicio" aria-label="Inicio del teléfono"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <button data-nav="recientes" aria-label="Volver a Mi Guaria"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      </nav>
    </div>
    <aside id="franja" class="franja" aria-label="Franja de eventos"></aside>
  </div>
  <div id="panel" class="panel" hidden></div>
  <noscript>Mi Guaria necesita JavaScript. Ábrala con un servidor local, por ejemplo: python -m http.server 3000</noscript>
</body>
</html>
